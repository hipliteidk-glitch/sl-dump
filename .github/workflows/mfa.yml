name: mfa-sl
on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: 'URL to download the EXE from'
        required: true
jobs:
  mfa:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Clone CTFAK2.0
        shell: pwsh
        run: git clone --depth 1 https://github.com/CTFAK/CTFAK2.0.git ct
      - name: Apply patches
        shell: pwsh
        run: |
          Copy-Item files/CTFAKCore.cs ct/Core/CTFAK.Core/CTFAKCore.cs -Force
          Copy-Item files/NativeLib.cs ct/Core/CTFAK.Core/Utils/NativeLib.cs -Force
          Copy-Item files/ExeFileReader.cs ct/Core/CTFAK.Core/EXE/ExeFileReader.cs -Force
          Copy-Item native/encryption.h,native/encryption.cpp,native/wrapper.cpp,native/tinflate.c,native/tinf.h ct/Core/CTFAK-Native/ -Force
      - name: Build
        shell: pwsh
        run: |
          cd ct
          dotnet build CTFAK.sln -c Release
      - name: Download EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          curl.exe -L --retry 3 --retry-delay 5 -o work/game.exe "${{ inputs.exe_url }}"
          Get-Item work/game.exe | Select-Object Length
      - name: Export MFA
        shell: pwsh
        run: |
          $cli = "ct/Interface/CTFAK.Cli/bin/Release/net6.0-windows"
          New-Item -ItemType Directory -Force -Path "$cli/Plugins" | Out-Null
          Copy-Item "ct/Plugins/Dumper/bin/Release/net6.0-windows/Dumper.dll" "$cli/Plugins/" -Force
          Copy-Item "ct/Plugins/CTFAK.Decompiler/bin/Release/net6.0-windows/CTFAK.Decompiler.dll" "$cli/Plugins/" -Force
          $exe = (Resolve-Path "work/game.exe").Path
          Set-Location $cli
          Copy-Item "$env:GITHUB_WORKSPACE/template.mfa" "$PWD/template.mfa" -Force
          Get-Item template.mfa | Select-Object Length
          "1" | dotnet CTFAK.Cli.dll -path $exe -parameters "-log"
          Get-ChildItem -Recurse -Filter *.mfa | Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl-mfa
          path: |
            ct/Interface/CTFAK.Cli/bin/Release/net6.0-windows/**/*.mfa
          if-no-files-found: warn
