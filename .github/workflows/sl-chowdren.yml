name: sl-chowdren
on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: 'URL to the Sister Location exe'
        required: true
      title:
        description: 'Game title'
        required: false
        default: "Five Nights at Freddy's: Sister Location"

jobs:
  build:
    # Public repo: GitHub-hosted arm64 runner (native aarch64, no qemu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full file
          df -h /

      - name: Fetch Chowdren aarch64 toolchain
        run: |
          mkdir -p rt port/gamedata port/patch
          curl -L --retry 3 --retry-delay 5 -o rt.7z \
            "https://raw.githubusercontent.com/PortsMaster/PortMaster-New/main/ports/fnaf1/fnaf1/patch/decompiler.7z"
          ls -l rt.7z
          7z x -y rt.7z -ort > /dev/null
          chmod -R +x rt/bin rt/toolchain/bin rt/python27/bin 2>/dev/null || true
          echo "--- runtime ---"
          ls -l rt
          file rt/python27/bin/python2.7 rt/toolchain/bin/gccc

      - name: Patch converter for SL group references
        run: |
          python3 ci/patch_chowdren.py rt

      - name: Fetch old glibc (2.31) for linking
        run: |
          # ArkOS/R36S is focal-era (glibc 2.31); linking against the runner's
          # glibc 2.39 produces a binary the device refuses to start.
          mkdir -p rt/libc231
          curl -L --retry 3 --retry-delay 5 -o libc6.deb \
            "https://deb.debian.org/debian/pool/main/g/glibc/libc6_2.31-13+deb11u11_arm64.deb"
          ls -l libc6.deb
          dpkg-deb -x libc6.deb rt/libc231
          ls -l rt/libc231/lib/aarch64-linux-gnu/libc.so.6 rt/libc231/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
          ls rt/libc231/lib/aarch64-linux-gnu | head -20

      - name: Fetch game exe
        run: |
          curl -L --retry 3 --retry-delay 5 -o port/gamedata/sl.exe "${{ inputs.exe_url }}"
          ls -l port/gamedata/sl.exe
          file port/gamedata/sl.exe

      - name: Convert + compile (on-device pipeline)
        run: |
          set -o pipefail
          export CHOWDREN_WORKERS=4
          export CHOWDREN_MAKE_JOBS=4
          GLIBC_DIR="$PWD/rt/libc231/lib/aarch64-linux-gnu"
          export LDFLAGS="-L$GLIBC_DIR -Wl,-rpath-link,$GLIBC_DIR -Wl,--allow-shlib-undefined $LDFLAGS"
          rt/bin/chowdren-build \
            --game-dir "$PWD/port" \
            --exe sl.exe \
            --title "${{ inputs.title }}" \
            --no-launch 2>&1 | tee build.log
          echo "--- results ---"
          ls -l port/build | head -40
          test -x port/build/Chowdren || { echo "NO BINARY PRODUCED"; exit 1; }
          echo "--- required glibc versions ---"
          strings -a port/build/Chowdren | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -5
          MAXG="$(strings -a port/build/Chowdren | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1 | sed 's/GLIBC_//')"
          echo "max: $MAXG"
          awk -v v="$MAXG" 'BEGIN { if (v + 0 <= 2.31) { print "glibc target OK"; exit 0 } print "GLIBC TOO NEW FOR ArkOS: " v; exit 1 }'

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl-chowdren-build
          path: |
            port/build/Chowdren
            port/build/Assets.dat
            port/build/*.cpp
            port/build/*.h
            build.log
          if-no-files-found: warn
