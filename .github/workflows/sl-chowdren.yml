name: sl-chowdren
on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: 'Optional exe URL; empty = private release asset (hipliteidk-glitch/sl-assets)'
        required: false
        default: ''
      title:
        description: 'Game title'
        required: false
        default: "Five Nights at Freddy's: Sister Location"

jobs:
  build:
    # Public repo: GitHub-hosted arm64 runner (native aarch64, no qemu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full file ffmpeg
          df -h /

      - name: Fetch Chowdren aarch64 toolchain
        run: |
          mkdir -p rt port/gamedata port/patch
          curl -L --retry 3 --retry-delay 5 -o rt.7z \
            "https://raw.githubusercontent.com/PortsMaster/PortMaster-New/main/ports/fnaf1/fnaf1/patch/decompiler.7z"
          ls -l rt.7z
          7z x -y rt.7z -ort > /dev/null
          chmod -R +x rt/bin rt/toolchain/bin rt/python27/bin 2>/dev/null || true
          # gl4es presents a desktop-GL profile that never advertises
          # GL_KHR_texture_compression_astc_ldr, so ASTC blobs are fatal on the
          # console: "ASTC extension ... not present on this driver; ASTC images
          # will be reported as errors instead of uploaded", one error per image,
          # no textures. imageworker.py only enables ASTC when this encoder is
          # present *and* executable, so moving it aside makes the converter emit
          # zlib-compressed images - the format this runtime expects behind gl4es.
          mv rt/tools/astcenc-native rt/tools/astcenc-native.disabled
          echo "--- runtime ---"
          ls -l rt
          file rt/python27/bin/python2.7 rt/toolchain/bin/gccc

      - name: Patch converter for SL group references
        run: |
          python3 ci/patch_chowdren.py rt

      - name: Render directly to the screen (disable the screen FBO)
        run: |
          # Mali-G31 behind gl4es' GLES1 backend never completes Chowdren's
          # WINDOW_WIDTH x WINDOW_HEIGHT screen FBO:
          #   glCheckFramebufferStatus -> 0x8CD7 (INCOMPLETE_MISSING_ATTACHMENT)
          # Every draw into it is dropped (0x506 INVALID_FRAMEBUFFER_OPERATION)
          # and the composite samples an empty texture, so the port runs at a
          # steady 30-60 FPS and presents a flat white canvas. The fnaf4 port hit
          # the same wall and renders straight into the scaled viewport instead.
          # This step fails fast, before the conversion, if the source differs.
          python3 ci/patch_direct.py rt
          echo "--- patched markers ---"
          grep -rn 'direct-to-screen' rt --include=platform.cpp | head -10

      - name: Cache game exe
        uses: actions/cache@v4
        with:
          path: port/gamedata/sl.exe
          key: sl-exe-sl-v1

      - name: Fetch game exe
        env:
          GH_TOKEN: ${{ secrets.ASSET_TOKEN }}
        run: |
          # 366 MB through a Cloudflare quick tunnel runs at 0.09-3 MB/s on the
          # phone's ~1.5 MB/s uplink, i.e. 2-68 minutes per run for a file that
          # never changes. The canonical copy lives in a private release and
          # comes down from GitHub's CDN instead.
          if [ -s port/gamedata/sl.exe ]; then
            echo "exe restored from Actions cache"
          elif [ -n "${{ inputs.exe_url }}" ]; then
            echo "downloading from ${{ inputs.exe_url }}"
            curl -L --retry 3 --retry-delay 5 -o port/gamedata/sl.exe "${{ inputs.exe_url }}"
          else
            mkdir -p /tmp/exe
            gh release download v1 --repo hipliteidk-glitch/sl-assets \
              --pattern '*.exe' --dir /tmp/exe --clobber
            mv /tmp/exe/*.exe port/gamedata/sl.exe
          fi
          ls -l port/gamedata/sl.exe
          file port/gamedata/sl.exe
          sha256sum port/gamedata/sl.exe
          # Pinned to the asset's own digest, which in turn matches the
          # original file on disk byte for byte (366,838,254 bytes). A
          # truncated download, a swapped release asset, or a bad cache
          # restore now aborts the build instead of silently converting the
          # wrong bytes into a port that looks fine until it runs.
          echo "cd21020de386b0de4885c13ec9ed87a23ce868d593045d96c45c6e68a9d3750a  port/gamedata/sl.exe" \
            | sha256sum -c -

      - name: Convert + compile (on-device pipeline)
        run: |
          set -o pipefail
          export CHOWDREN_WORKERS=4
          export CHOWDREN_MAKE_JOBS=4
          rt/bin/chowdren-build \
            --game-dir "$PWD/port" \
            --exe sl.exe \
            --title "${{ inputs.title }}" \
            --no-launch 2>&1 | tee build.log
          echo "--- results ---"
          ls -l port/build | head -40
          test -x port/build/Chowdren || { echo "NO BINARY PRODUCED"; exit 1; }
          if grep -q 'left as MP3' build.log; then
            echo "ERROR: some sounds could not be transcoded to OGG"
            grep 'left as MP3' build.log | tail -1
            exit 1
          fi
          if grep -q 'Using ASTC' build.log; then
            echo "ERROR: images were ASTC-compressed; gl4es cannot sample ASTC"
            exit 1
          fi
          if ! grep -q 'Falling back to zlib' build.log; then
            echo "ERROR: no zlib-compressed images in build.log - check imageworker.py"
            exit 1
          fi
          echo "--- image compression ---"
          echo "zlib images: $(grep -c 'Falling back to zlib' build.log)"
          echo "--- required glibc versions (ArkOS target is >= 2.34) ---"
          strings -a port/build/Chowdren | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -5

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl-chowdren-build
          path: |
            port/build/Chowdren
            port/build/Assets.dat
            port/build/*.cpp
            port/build/*.h
            build.log
          if-no-files-found: warn
