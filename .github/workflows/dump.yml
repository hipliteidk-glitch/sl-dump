name: dump-sl
on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: 'URL to download the EXE from'
        required: true
jobs:
  dump:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Clone CTFAK2.0
        shell: pwsh
        run: git clone --depth 1 https://github.com/CTFAK/CTFAK2.0.git ct
      - name: Apply patches
        shell: pwsh
        run: |
          Copy-Item files/CTFAKCore.cs ct/Core/CTFAK.Core/CTFAKCore.cs -Force
          Copy-Item files/NativeLib.cs ct/Core/CTFAK.Core/Utils/NativeLib.cs -Force
          Copy-Item files/ExeFileReader.cs ct/Core/CTFAK.Core/EXE/ExeFileReader.cs -Force
          Copy-Item native/* ct/Core/CTFAK-Native/ -Force
      - name: Build
        shell: pwsh
        run: |
          cd ct
          dotnet build CTFAK.sln -c Release
      - name: Setup native deps
        shell: pwsh
        run: |
          $cli = "ct/Interface/CTFAK.Cli/bin/Release/net6.0-windows"
          New-Item -ItemType Directory -Force -Path "$cli/x64" | Out-Null
          $cliFull = (Resolve-Path $cli).Path

          # zlib: Joveler.Compression.ZLib expects zlibwapi.dll on Windows
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -A x64
          if ($LASTEXITCODE -ne 0) { throw "zlib cmake configure failed" }
          cmake --build zlib-build --config Release
          if ($LASTEXITCODE -ne 0) { throw "zlib build failed" }
          $zlib = Get-ChildItem zlib-build -Recurse -Filter zlib1.dll | Select-Object -First 1
          if (-not $zlib) { throw "zlib1.dll was not produced" }
          Copy-Item $zlib.FullName "$cli/x64/zlibwapi.dll" -Force

          # CTFAK-Native is a .vcxproj; dotnet build does not compile it
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild "ct/Core/CTFAK-Native/CTFAK-Native.vcxproj" /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$cliFull\x64\"
          if ($LASTEXITCODE -ne 0) { throw "CTFAK-Native build failed" }
          if (-not (Test-Path "$cli/x64/CTFAK-Native.dll")) { throw "CTFAK-Native.dll was not produced" }

          # P/Invoke resolves by filename from the app directory
          Copy-Item "$cli/x64/CTFAK-Native.dll" "$cli/CTFAK-Native.dll" -Force
          Get-ChildItem "$cli/x64" | Select-Object Name, Length
      - name: Download EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          curl.exe -L --retry 3 --retry-delay 5 -o work/game.exe "${{ inputs.exe_url }}"
          Get-Item work/game.exe | Select-Object Length
      - name: Dump
        shell: pwsh
        run: |
          $cli = "ct/Interface/CTFAK.Cli/bin/Release/net6.0-windows"
          New-Item -ItemType Directory -Force -Path "$cli/Plugins" | Out-Null
          Copy-Item "ct/Plugins/Dumper/bin/Release/net6.0-windows/Dumper.dll" "$cli/Plugins/" -Force
          Copy-Item "ct/Plugins/CTFAK.Decompiler/bin/Release/net6.0-windows/CTFAK.Decompiler.dll" "$cli/Plugins/" -Force
          $exe = (Resolve-Path "work/game.exe").Path
          Set-Location $cli
          "2" | dotnet CTFAK.Cli.dll -path $exe -parameters "-log"
          Get-ChildItem -Recurse Dumps | Measure-Object -Property Length -Sum | Select-Object Count,Sum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl-dump
          path: |
            ct/Interface/CTFAK.Cli/bin/Release/net6.0-windows/Dumps*/**
          if-no-files-found: warn
